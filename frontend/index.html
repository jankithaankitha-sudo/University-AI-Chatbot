<!DOCTYPE html>
<html>
<head>
  <title>🎓 University AI Chatbot</title>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }

    /* MAIN APP CARD */
    .app {
      width: 100vw;
      height: 100vh;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(15px);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* IMAGE HEADER */
    .hero img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
    }

    /* TITLE */
    .header {
      background: rgba(37, 99, 235, 0.9);
      color: white;
      padding: 15px;
      text-align: center;
      font-weight: bold;
      font-size: 18px;
      letter-spacing: 0.5px;
    }

    /* CHAT AREA */
    #chat {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* MESSAGE */
    .msg {
      padding: 10px 14px;
      border-radius: 12px;
      max-width: 75%;
      font-size: 14px;
      line-height: 1.4;
      animation: fadeIn 0.3s ease-in-out;
    }

    .user {
      align-self: flex-end;
      background: #2563eb;
      color: white;
    }

    .bot {
      align-self: flex-start;
      background: rgba(255,255,255,0.9);
      color: #111;
    }

    .typing {
      font-style: italic;
      opacity: 0.7;
    }

    /* INPUT */
    .inputBox {
      display: flex;
      padding: 10px;
      background: rgba(255,255,255,0.05);
    }

    input {
      flex: 1;
      padding: 12px;
      border: none;
      outline: none;
      border-radius: 8px;
    }

    button {
      margin-left: 8px;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    @keyframes fadeIn {
      from {opacity:0; transform: translateY(5px);}
      to {opacity:1; transform: translateY(0);}
    }
  </style>
</head>

<body>

<div class="app">

  <!-- UNIVERSITY IMAGE -->
  <div class="hero">
    <img src="https://images.unsplash.com/photo-1562774053-701939374585?w=1200" />
  </div>

  <!-- HEADER -->
  <div class="header">
    🎓 University AI Assistant
  </div>

  <!-- CHAT -->
  <div id="chat">
    <div class="msg bot">
      👋 Welcome! Ask about fees, admissions, hostel, courses, etc.
    </div>
  </div>

  <!-- INPUT -->
  <div class="inputBox">
    <input id="input" placeholder="Ask something..." />
    <button onclick="send()">Send</button>
  </div>

</div>

<script>
async function send() {
  const input = document.getElementById("input");
  const chat = document.getElementById("chat");

  const msg = input.value.trim();
  if (!msg) return;

  chat.innerHTML += `<div class="msg user">${msg}</div>`;
  input.value = "";

  const typing = document.createElement("div");
  typing.className = "msg bot typing";
  typing.innerHTML = "Thinking...";
  chat.appendChild(typing);

  chat.scrollTop = chat.scrollHeight;

  try {
    const res = await fetch("http://localhost:5000/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message: msg })
    });

    const data = await res.json();

    typing.remove();

    chat.innerHTML += `<div class="msg bot">${data.answer}</div>`;
  } catch (err) {
    typing.remove();
    chat.innerHTML += `<div class="msg bot">❌ Backend not connected</div>`;
  }

  chat.scrollTop = chat.scrollHeight;
}

document.getElementById("input").addEventListener("keypress", function(e){
  if(e.key === "Enter") send();
});
</script>

</body>
</html>
